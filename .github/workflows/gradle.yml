name: Gradle Build

on:
  push:
  pull_request:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      - name: Build and test
        run: ./gradlew build
      - name: Check OpenGL and Vulkan shaders
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          tools/scripts/check-shaders.sh
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: THM-Addons-26.2
          path: build/libs/THM-Addons-*.jar
